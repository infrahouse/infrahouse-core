[build-system]
requires = [
    "setuptools ~=80.9"
]
build-backend = "setuptools.build_meta"

[project]
name = "infrahouse-core"
version = "1.1.2"
description = "Lightweight Python library with AWS and other general purpose classes."
readme = "README.rst"
requires-python = ">=3.10"
authors = [
  {name = "InfraHouse Inc.", email = "aleks@infrahouse.com"}
]
maintainers = [
  {name = "Oleksandr Kuzminskyi", email = "aleks@infrahouse.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Apache Software License",
]
license = {text = "Apache Software License 2.0"}
dependencies = [
    "boto3 ~= 1.36",
    "cached-property ~= 2.0",
    # cryptography is a transitive dependency (PyGithub -> pyjwt[crypto]). This
    # is a deliberate security-motivated exception to the "pin to major with ~="
    # standard: wheels < 48.0.1 statically link a vulnerable OpenSSL
    # (GHSA-537c-gmf6-5ccf, High, CVSS 7.5), and cryptography bumps its major
    # version frequently (48 -> 49 already released), so a "~= 48.0" pin would
    # immediately go stale and cap consumers below the current secure release.
    # Use a floor only so every consumer inherits the fix without an upper cap.
    "cryptography >= 48.0.1",
    "diskcache ~= 5.6",
    "ec2-metadata ~= 2.13",
    "PyGithub ~= 2.4",
]

[project.optional-dependencies]
dev = [
    "black ~= 26.3, >= 26.3.1",
    "build ~= 1.2",
    "bump2version ~= 1.0",
    "mdformat ~=1.0",
    "pytest ~=9.0",
    "pytest-cov ~=7.0",
    "pylint ~=4.0",
    "yamllint ~= 1.37",
]
doc = [
    "Sphinx ~= 8.1"
]

[project.urls]

bugs = "https://github.com/infrahouse/infrahouse-core/issues"
changelog = "https://github.com/infrahouse/infrahouse-core/commits/main/"
homepage = "https://github.com/infrahouse/infrahouse-core"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
