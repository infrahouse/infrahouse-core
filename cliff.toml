# git-cliff configuration.
# Used by .github/workflows/release.yml to generate GitHub release notes.
#
# This project does not require conventional commits (see CONTRIBUTING.rst), so
# unconventional messages are kept and land in the "Other" group instead of being
# dropped from the changelog.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Keep commits that are not conventional commits -- they are grouped as "Other".
filter_unconventional = false
split_commits = false
# Only commits matching a parser below appear in the changelog. The last parser
# is a catch-all, so this only drops what is explicitly skipped.
filter_commits = true
commit_parsers = [
    { message = "^[Bb]ump version", skip = true },
    { message = "^Merge (branch|pull request|remote-tracking)", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^(chore|ci|build)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 8 -->💼 Other" },
]
protect_breaking_commits = false
tag_pattern = "v?[0-9].*"
topo_order = false
sort_commits = "oldest"
